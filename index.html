<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>عيد ميلاد ضحى 🦋</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo&family=Great+Vibes&family=Scheherazade&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* التنسيقات الكاملة هنا */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #fff0f5, #e0f7fa);
      transition: background 1s ease-in-out;
    }

    .butterfly {
      position: relative;
      width: 90%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(255, 182, 193, 0.5),
                  0 0 60px rgba(173, 216, 230, 0.4),
                  0 0 90px rgba(255, 255, 255, 0.3);
      animation: openWings 2s ease;
    }

    @keyframes openWings {
      0% { transform: scale(0.95) rotateX(20deg); opacity: 0; }
      100% { transform: scale(1) rotateX(0deg); opacity: 1; }
    }

    h2 {
      font-size: 32px;
      color: #d81b60;
      text-align: center;
      margin-bottom: 25px;
      font-family: 'Great Vibes', cursive;
      animation: glowTitle 3s infinite;
    }

    @keyframes glowTitle {
      0% { text-shadow: 0 0 10px #fff; }
      50% { text-shadow: 0 0 20px #ff69b4; }
      100% { text-shadow: 0 0 10px #fff; }
    }

    p span {
      display: block;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.6s ease;
    }

    p span.visible {
      opacity: 1;
      transform: translateY(0);
    }

    p span:hover {
      text-shadow: 0 0 8px #ffd1dc;
      color: #d81b60;
    }

    .effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .drop {
      position: fixed;
      font-size: 22px;
      animation: fall 6s linear;
    }

    @keyframes fall {
      0% { top: -30px; opacity: 1; transform: rotate(0deg); }
      100% { top: 100%; opacity: 0; transform: rotate(360deg); }
    }

    .controls, .share-buttons {
      text-align: center;
      margin-top: 30px;
    }

    .controls button, .share-buttons button {
      padding: 10px 20px;
      margin: 6px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #f48fb1, #80deea);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
      transition: transform 0.3s;
    }

    .controls button:hover, .share-buttons button:hover {
      transform: scale(1.05);
    }

    .flying-butterfly {
      position: fixed;
      font-size: 28px;
      animation: flyAcross 12s linear infinite;
      z-index: 1000;
    }

    @keyframes flyAcross {
      0% { transform: translateX(-100px) rotate(0deg); }
      100% { transform: translateX(120vw) rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- فراشات طائرة -->
  <div class="flying-butterfly" style="top:20%; animation-delay: 0s;">🦋</div>
  <div class="flying-butterfly" style="top:40%; animation-delay: 2s;">🦋</div>
  <div class="flying-butterfly" style="top:60%; animation-delay: 4s;">🦋</div>
  <div class="flying-butterfly" style="top:80%; animation-delay: 6s;">🦋</div>

  <!-- البطاقة -->
  <div class="butterfly">
    <div class="effects" id="effects"></div>
    <h2 id="title">🎂🌸 عيد ميلاد سعيد يا ضحى 🌸🎂</h2>

    <!-- أزرار التحكم -->
    <div class="controls">
      <button onclick="setLanguage('ar')">🇲🇦 العربية</button>

      <button onclick="launchAllEffects()">🦋 أطلقي السحر</button>
      <button onclick="replayCard()">🔄 أعيدي قراءتها</button>

      <a href="https://api.whatsapp.com/send?text=🎂🌸 بطاقة عيد ميلاد ضحى 🌸🎂%0Aافتحيها من هنا: https://hadydassouki44-hub.github.io/Doha-gift/" target="_blank">
        <button>📲 شاركي عبر واتساب</button>
      </a>
      <a href="https://www.instagram.com/" target="_blank">
        <button>📸 شاركي عبر إنستغرام</button>
      </a>
    </div>
  </div>
