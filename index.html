<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>عيد ميلاد ضحى 🦋</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cairo&family=Great+Vibes&family=Scheherazade&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      direction: rtl;
      background: linear-gradient(to bottom right, #fff0f5, #e0f7fa);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 90%;
      max-width: 720px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      border-radius: 40px;
      padding: 40px;
      box-shadow: 0 0 30px rgba(255, 182, 193, 0.5),
                  0 0 60px rgba(173, 216, 230, 0.4),
                  0 0 90px rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    h2 {
      font-size: 32px;
      color: #d81b60;
      font-family: 'Great Vibes', cursive;
      margin-bottom: 25px;
      animation: glow 3s infinite;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px #fff; }
      50% { text-shadow: 0 0 20px #ff69b4; }
      100% { text-shadow: 0 0 10px #fff; }
    }

    #message span {
      display: block;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.6s ease;
    }

    #message span.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .controls button {
      padding: 10px 20px;
      margin: 6px;
      font-size: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to right, #f48fb1, #80deea);
      color: white;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
      transition: transform 0.3s;
    }

    .controls button:hover {
      transform: scale(1.05);
    }

    .effects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .drop {
      position: fixed;
      font-size: 22px;
      animation: fall 6s linear;
    }

    @keyframes fall {
      0% { top: -30px; opacity: 1; transform: rotate(0deg); }
      100% { top: 100%; opacity: 0; transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎂🌸 عيد ميلاد سعيد يا ضحى 🌸🎂</h2>
    <div id="message"></div>

    <div class="controls">
      <button onclick="setLanguage('ar')">🇲🇦 العربية</button>
      <button onclick="setLanguage('fr')">🇫🇷 Français</button>
      <button onclick="setLanguage('en')">🇬🇧 English</button>
      <button onclick="launchEffects()">🦋 أطلقي السحر</button>
      <button onclick="replayMessage()">🔄 أعيدي القراءة</button>
    </div>
  </div>

  <div class="effects" id="effects"></div>

  <script>
    const messages = {
      ar: `اليوم مو بس عيد ميلادك… اليوم ذكرى دخول إنسانة مميزة جدًا لحياة كل اللي يعرفوها 🤍

أنتِ يا ضحى مش بس صديقة، أنتي روح حلوة، وقلبك أبيض، وابتسامة صافية، وكتف يتسند عليه وقت التعب.

صح إنو ما بعرفك منيح، بس هدول الصفات موجودة عندك أكيد 🌟💖

من أول ما عرفتك وأنا متأكد إنك من النوع اللي بيترك أثر حقيقي…
أثر من طيبة ومن حب ومن مواقف ما تنسى.

أتمنى لكِ سنة جديدة مليانة:
✨ لحظات تفرحي فيها من قلبك
📚 نجاحات تفرّحك وتخليك فخورة بنفسك
🛫 فرص حلوة تغيّر حياتك للأفضل
💖 ناس يحبّوك بصدق ويكونوا دايمًا جنبك

ذكّري نفسك دايمًا إنك تستحقين كل شيء جميل
لأنك فعلًا إنسانة جميلة من الداخل والخارج 🌷

كل سنة وأنتِ بخير يا صديقتي،
وإن شاء الله كل سنة تكون أحلى من اللي قبلها، وأقرب لأحلامك الكبيرة 🎉🎊🥳`,

      fr: `Aujourd’hui, ce n’est pas juste ton anniversaire… C’est le souvenir de l’entrée d’une personne très spéciale dans la vie de tous ceux qui la connaissent 🤍

Toi, Doha, tu n’es pas juste une amie, tu es une âme douce, un cœur pur, un sourire sincère, une épaule sur laquelle on peut se reposer.

Même si je ne te connais pas très bien, je suis sûr que tu portes toutes ces qualités 🌟💖

Depuis que je t’ai rencontrée, je sais que tu es du genre à laisser une vraie empreinte…
Une empreinte de bonté, d’amour et de souvenirs inoubliables.

Je te souhaite une nouvelle année remplie de:
✨ Moments de joie sincère
📚 Réussites qui te rendent fière
🛫 Opportunités qui changent ta vie
💖 Des gens qui t’aiment vraiment et restent à tes côtés

Rappelle-toi toujours que tu mérites tout ce qui est beau
Parce que tu es vraiment belle à l’intérieur comme à l’extérieur 🌷

Joyeux anniversaire ma chère amie,
Que chaque année soit meilleure que la précédente et plus proche de tes grands rêves 🎉🎊🥳`,

      en: `Today isn’t just your birthday… It’s the day a truly special person entered the lives of everyone who knows her 🤍

You, Doha, are not just a friend—you’re a kind soul, a pure heart, a sincere smile, and a shoulder to lean on.

Even if I don’t know you deeply, I’m sure you carry all these qualities 🌟💖

From the moment I met you, I knew you were the kind who leaves a real mark…
A mark of kindness, love, and unforgettable moments.

I wish you a new year full of:
✨ Moments of true joy
📚 Successes that make you proud
🛫 Beautiful opportunities that change your life
💖 People who love you sincerely and stay by your side

Always remind yourself that you deserve everything beautiful
Because you truly are beautiful inside and out 🌷

Happy birthday my dear friend,
May each year be better than the last and closer to your biggest dreams 🎉🎊🥳`
    };

    function setLanguage(lang) {
      const message = messages[lang];
      const container = document.getElementById("message");
      container.innerHTML = "";
      message.split("\n").forEach((line, i) => {
        const span = document.createElement("span");
        span.textContent = line;
        setTimeout(() => span.classList.add("visible"), i * 100);
        container.appendChild(span);
      });
    }

    function launchEffects() {
      for (let i = 0; i < 30; i++) {
        const drop = document.createElement("div");
        drop.className = "drop";
        drop.textContent = Math.random() > 0.5 ? "💖" : "✨";
        drop.style.left = Math.random() * 100 + "vw";
        drop.style.fontSize = (Math.random() * 20 + 20) + "px";
        drop.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.getElementById("effects").appendChild(drop);
      }
    }

    function replayMessage() {
      document.getElementById("message").innerHTML = "";
    }
  </
